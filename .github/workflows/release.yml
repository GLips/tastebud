# Builds the tastebud binary on each release platform, runs the gate and the compiled-binary smoke tests, and
# uploads the archives. A tag then gets the GitHub release and the npm publish; `bun run release` pushes it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # check:rules runs oxlint's RuleTester, which needs real Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Tag matches TASTEBUD_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(bun -e 'import { TASTEBUD_VERSION } from "@tastebud/core/taste-vocabulary"; console.log(TASTEBUD_VERSION)')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - run: bun run check
      - run: bun scripts/build-tastebud-binary.ts --target bun-${{ matrix.platform }}
      # The binary alone, outside the checkout, so nothing it embeds can fall back on workspace files. The
      # plugin test serves it as a local release, so bin/tastebud downloads it and drives the loop over MCP.
      - name: Smoke-test the compiled binary
        run: |
          smoke="${RUNNER_TEMP}/tastebud-smoke"
          mkdir -p "$smoke"
          cp dist/bin/${{ matrix.platform }}/tastebud "$smoke/tastebud"
          TASTEBUD_TEST_BINARY="$smoke/tastebud" bun test --timeout 30000 test/review.test.ts test/mcp.test.ts test/places.test.ts test/claude-code-plugin.test.ts
      - name: Archive
        run: tar -czf tastebud-${{ matrix.platform }}.tar.gz -C dist/bin/${{ matrix.platform }} tastebud
      - uses: actions/upload-artifact@v4
        with:
          name: tastebud-${{ matrix.platform }}
          path: tastebud-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum tastebud-*.tar.gz > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # checkout leaves the tag lightweight, so it is fetched again to carry the notes `bun run release` wrote.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" release/* plugins/tastebud/scripts/install.sh --notes-from-tag

  publish-npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/write-npm-package.ts
      # After the GitHub release (needs: release): the package holds no binary and fetches it from there.
      - run: npm publish dist/npm/tastebud --provenance --access public
